<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml"><ui:define name="titulo">Veículos</ui:define><ui:define name="conteudo"><h1>Veículos</h1><p class="subtitulo">Gerencie os carros disponíveis para venda.</p><h:form id="form" enctype="multipart/form-data"><p:growl id="mensagens" showDetail="true"/><p:messages><p:autoUpdate/></p:messages><h:panelGroup id="cadastro" layout="block" styleClass="painel"><h2><h:outputText value="#{empty produtoController.editando.id ? 'Cadastrar veículo' : 'Editar veículo'}"/></h2><div class="formulario"><div class="campo"><label>Modelo / versão *</label><p:inputText id="nome" value="#{produtoController.editando.nome}" required="true" requiredMessage="Informe o nome." maxlength="150"/></div><div class="campo"><label>Preço (R$) *</label><p:inputNumber id="preco" value="#{produtoController.editando.preco}" decimalPlaces="2" decimalSeparator="," thousandSeparator="." minValue="0.01" maxValue="9999999999.99" required="true" requiredMessage="Informe o preço."/></div><div class="campo"><label>Quantidade em estoque *</label><p:inputNumber id="estoque" value="#{produtoController.editando.quantidadeEstoque}" decimalPlaces="0" minValue="0" maxValue="2147483647" required="true"/></div><div class="campo"><label>Marca *</label><p:selectOneMenu value="#{produtoController.editando.marca}" converter="marcaConverter" required="true" requiredMessage="Selecione a marca." filter="true" filterMatchMode="contains"><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.marcas}" var="op" itemValue="#{op}" itemLabel="#{op.nome}"/></p:selectOneMenu></div><div class="campo"><label>Categoria *</label><p:selectOneMenu value="#{produtoController.editando.categoria}" converter="categoriaConverter" required="true" requiredMessage="Selecione a categoria." filter="true" filterMatchMode="contains"><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.categorias}" var="op" itemValue="#{op}" itemLabel="#{op.rotulo}"/></p:selectOneMenu></div><div class="campo"><label>Ano/modelo *</label><p:inputNumber id="anoModelo" value="#{produtoController.editando.anoModelo}" decimalPlaces="0" thousandSeparator="" minValue="1886" maxValue="2100" required="true" requiredMessage="Informe o ano/modelo."/></div>
<div class="campo"><label>Quilometragem (km) *</label><p:inputNumber id="quilometragem" value="#{produtoController.editando.quilometragem}" decimalPlaces="0" minValue="0" maxValue="2147483647" required="true" requiredMessage="Informe a quilometragem."/></div>
<div class="campo"><label>Combustível *</label><p:selectOneMenu id="combustivel" value="#{produtoController.editando.combustivel}" required="true" requiredMessage="Selecione o combustível."><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.combustiveis}" var="op" itemValue="#{op}" itemLabel="#{op.rotulo}"/></p:selectOneMenu></div>
<div class="campo"><label>Câmbio *</label><p:selectOneMenu id="cambio" value="#{produtoController.editando.cambio}" required="true" requiredMessage="Selecione o câmbio."><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.cambios}" var="op" itemValue="#{op}" itemLabel="#{op.rotulo}"/></p:selectOneMenu></div>
<div class="campo"><label>Cor</label><p:inputText id="cor" value="#{produtoController.editando.cor}" maxlength="40"/></div>
<div class="campo"><label>Descrição</label><p:inputTextarea value="#{produtoController.editando.descricao}" rows="3"/></div><div class="campo larga"><label>Imagem (JPG, PNG ou WEBP; até 2 MB)</label><p:fileUpload mode="advanced" auto="true" multiple="false" listener="#{produtoController.upload}" process="@this" update=":form:preview :form:mensagens" label="Escolher imagem"><p:validateFile sizeLimit="2097152" allowTypes="/(\.|\/)(jpe?g|png|webp)$/"/></p:fileUpload><h:panelGroup id="preview"><h:panelGroup rendered="#{not empty produtoController.preview}"><img src="#{produtoController.preview}" class="preview" alt="Pré-visualização da imagem selecionada"/></h:panelGroup><p:graphicImage value="/imagens/#{produtoController.editando.caminhoImagem}" rendered="#{empty produtoController.preview and not empty produtoController.editando.caminhoImagem}" styleClass="preview"/><h:outputText value="#{produtoController.nomePendente}"/></h:panelGroup></div></div><div class="acoes"><p:commandButton value="Salvar" icon="pi pi-check" action="#{produtoController.salvar}" process=":form:cadastro" update=":form:cadastro :form:tabela :form:mensagens"/><p:commandButton value="Novo / cancelar" styleClass="ui-button-secondary" action="#{produtoController.novo}" process="@this" update=":form:cadastro" resetValues="true" oncomplete="document.getElementById('form:cadastro').scrollIntoView({behavior: 'smooth', block: 'start'});"/></div></h:panelGroup><div class="painel"><p:commandButton value="Atualizar lista" icon="pi pi-refresh" action="#{produtoController.atualizar}" process="@this" update=":form:tabela :form:mensagens"/><p:dataTable styleClass="tabela-veiculos" id="tabela" value="#{produtoController.lista}" var="item" rowKey="#{item.id}" paginator="true" rows="10" rowsPerPageTemplate="5,10,20" paginatorPosition="bottom" emptyMessage="Nenhum registro encontrado."><p:column headerText="ID" sortBy="#{item.id}"><h:outputText value="#{item.id}"/></p:column><p:column headerText="Modelo / versão" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains"><h:outputText value="#{item.nome}"/></p:column><p:column headerText="Ano" sortBy="#{item.anoModelo}"><h:outputText value="#{item.anoModelo}"/></p:column><p:column headerText="Detalhes"><h:outputText value="#{item.quilometragem}"><f:convertNumber locale="pt_BR"/></h:outputText> km<br/><h:outputText value="#{item.combustivel.rotulo} · #{item.cambio.rotulo}"/><br/><h:outputText value="#{item.cor}"/></p:column><p:column headerText="Foto"><p:graphicImage value="/imagens/#{item.caminhoImagem}" rendered="#{not empty item.caminhoImagem}" styleClass="miniatura"/><h:outputText value="Sem imagem" rendered="#{empty item.caminhoImagem}"/></p:column><p:column headerText="Marca" sortBy="#{item.marca.nome}" filterBy="#{item.marca.nome}" filterMatchMode="contains"><h:outputText value="#{item.marca.nome}"/></p:column><p:column headerText="Categoria" filterBy="#{item.categoria.caminho}" filterMatchMode="contains"><h:outputText value="#{item.categoria.caminho}"/></p:column><p:column headerText="Preço" sortBy="#{item.preco}"><h:outputText value="#{item.preco}"><f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/></h:outputText></p:column><p:column headerText="Estoque" sortBy="#{item.quantidadeEstoque}"><h:outputText value="#{item.quantidadeEstoque}"/></p:column><p:column headerText="Ações"><p:commandButton value="Editar" icon="pi pi-pencil" action="#{produtoController.editar(item)}" process="@this" update=":form:cadastro" resetValues="true" oncomplete="document.getElementById('form:cadastro').scrollIntoView({behavior: 'smooth', block: 'start'});"/><p:commandButton value="Excluir" icon="pi pi-trash" styleClass="ui-button-danger" action="#{produtoController.excluir(item)}" process="@this" update=":form:tabela :form:mensagens"><p:confirm header="Confirmar exclusão" message="Deseja excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable></div></h:form></ui:define></ui:composition>
